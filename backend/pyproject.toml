[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "fakeredis>=2.35.1",
    "fastapi>=0.135.3",
    "fastapi-cache2[redis]>=0.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "opencv-contrib-python>=4.13.0.92",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "requests>=2.33.1",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
