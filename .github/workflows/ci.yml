name: CI - Testes e Segurança

on:
  push:
    branches: [ main, novaDB ] # Roda nas suas branches principais
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # Ganhe velocidade com cache de libs

      - name: Instalar Python
        run: uv python install 3.12

      - name: Rodar Linter (Ruff)
        run: uv run ruff check .

      - name: Security Scan (Bandit)
        # Como você é de SegInfo, isso aqui é obrigatório no seu currículo
        run: uv run bandit -r . -x ./tests

      - name: Rodar Testes (Pytest)
        run: uv run pytest
