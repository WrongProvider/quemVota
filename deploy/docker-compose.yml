
# ── Configurações Comuns do Airflow ──────────────────────────────────────────
x-airflow-common:
  &airflow-common # Substituímos 'image' por 'build' apontando para o seu novo Dockerfile
  build:
    context: ..
    dockerfile: airflow/Dockerfile

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "XKjh1bt0Um1X0dKiJLMY02wkf5K_j5BZwKJLAEuYvC8="
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_DB: ${POSTGRES_DB}
    DATABASE_URL: ${DATABASE_URL}
    PYTHONPATH: /opt/airflow
    DOCKER_HOST: tcp://docker-socket-proxy:2375
    HOME: /opt/airflow
    UV_CACHE_DIR: /tmp/.uv-cache
    HF_HOME: "/opt/airflow/.cache/huggingface"
    UV_NO_SYNC: "1"
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ../airflow/config:/opt/airflow/config
    - ../injest_banco/:/opt/airflow/injest_banco
    - ../embeddings/:/opt/airflow/embeddings
    - ../shared/:/opt/airflow/shared
    - airflow_hf_cache:/opt/airflow/.cache/huggingface
  networks:
    - backend
  depends_on:
    postgres-airflow:
      condition: service_healthy
    docker-socket-proxy:
      condition: service_started

services:
  # proxy docker
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: quemvota_docker_proxy
    environment:
      EXEC: "1"          # permite docker exec
      CONTAINERS: "1"    # permite inspecionar/listar containers (necessário p/ exec funcionar)
      POST: "1"          # exec é um POST na API do Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    restart: unless-stopped

  # ── Banco de Dados (Produção - QuemVota) ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: quemvota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Banco de Dados (Metadados do Airflow) ──────────────────────────────────
  postgres-airflow:
    image: postgres:15-alpine
    container_name: quemvota_postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Cache (Valkey) ──────────────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:7-alpine
    container_name: quemvota_valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (FastAPI) ───────────────────────────────────────────────────────────
  api:
    build:
      context: ../
      dockerfile: backend/Dockerfile.api
    container_name: quemvota_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quemvota_frontend
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

  # ── Proxy Reverso (Nginx) ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: quemvota_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certbot_certs:/etc/letsencrypt:ro
      - ./certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    networks:
      - frontend

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token SEU_TOKEN_AQUI
    networks:
      - frontend

  # ── Componentes do Apache Airflow ──────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: quemvota_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully # 👈 Garante que o init corrigiu as pastas antes de subir os serviços

  airflow-scheduler:
    <<: *airflow-common
    container_name: quemvota_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully # 👈 Garante que o init corrigiu as pastas antes de subir os serviços

  airflow-init:
      <<: *airflow-common
      container_name: quemvota_airflow_init
      user: "0:0" # 👈 Roda como root para poder aplicar o chown
      entrypoint: /bin/bash
      command:
        - -c
        - |
          # Garante que as pastas básicas existam no volume
          mkdir -v -p /opt/airflow/{logs,dags,plugins,config,embeddings}

          # Alinha as permissões de tudo dentro de /opt/airflow para o UID correto e Grupo 0
          echo "Corrigindo permissões de arquivos para ${AIRFLOW_UID:-50000}:0..."
          chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/

          echo "Inicializando o banco de dados do Airflow..."
          /entrypoint airflow db init

          # Cria o usuário padrão caso não exista
          /entrypoint airflow users create \
            --username admin \
            --password admin_password \
            --firstname Admin \
            --lastname Admin \
            --role Admin \
            --email admin@quemvota.com || true
      environment:
        <<: *airflow-common-env
        _AIRFLOW_DB_UPGRADE: "true" # Mantém a migration ativa para a sua versão 2.8.1

networks:
  backend:
  frontend:

volumes:
  postgres_data:
  postgres_airflow_data:
  valkey_data:
  airflow_hf_cache:
