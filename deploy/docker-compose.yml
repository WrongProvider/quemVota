# ── Configurações Comuns do Airflow ──────────────────────────────────────────
x-airflow-common:
  &airflow-common # Substituímos 'image' por 'build' apontando para o seu novo Dockerfile
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "EisUmaChaveFernetAleatoriaGereUmaComCryptography="
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_DB: ${POSTGRES_DB}
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ../airflow/config:/opt/airflow/config
    - ../injest_banco/:/opt/airflow/injest_banco
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - backend
  depends_on:
    postgres-airflow:
      condition: service_healthy
services:
  # ── Banco de Dados (Produção - QuemVota) ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quemvota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Banco de Dados (Metadados do Airflow) ──────────────────────────────────
  postgres-airflow:
    image: postgres:15-alpine
    container_name: quemvota_postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Cache (Valkey) ──────────────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:7-alpine
    container_name: quemvota_valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (FastAPI) ───────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    container_name: quemvota_api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quemvota_frontend
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

  # ── Proxy Reverso (Nginx) ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: quemvota_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certbot_certs:/etc/letsencrypt:ro
      - ./certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    networks:
      - frontend

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token SEU_TOKEN_AQUI
    networks:
      - frontend

  # ── Ingest (Script legado ou Job avulso) ────────────────────────────────────
  ingest:
    build:
      context: ../injest_banco
      dockerfile: Dockerfile.injest
    container_name: quemvota_ingest
    profiles:
      - ingest
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ── Componentes do Apache Airflow ──────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: quemvota_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: quemvota_airflow_scheduler
    command: scheduler
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: quemvota_airflow_init
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin_password # Altere em produção
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@quemvota.com

networks:
  backend:
  frontend:

volumes:
  postgres_data:
  postgres_airflow_data:
  valkey_data:
